[project]
name = "medinsumos-venezuela"
version = "1.0.0"
description = "API para gestionar la recolección de información sobre damnificados del terremoto de Venezuela"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.22",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
]

[tool.fastapi]
entrypoint = "main:app"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
